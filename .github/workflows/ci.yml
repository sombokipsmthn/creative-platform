name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Verify Node.js version
        run: |
          node --version
          node -e "if (!/^v22\\./.test(process.version)) process.exit(1)"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  typecheck:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Report development dependency audit
        run: npm audit --json > npm-audit-development.json || true

      - name: Upload development audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-development
          path: npm-audit-development.json
          retention-days: 30

      - name: Run dependency review
        uses: actions/dependency-review-action@v5
        if: github.event_name == 'pull_request'

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects
        continue-on-error: true

  responsive-admin:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creative_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d creative_platform"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Apply database migrations
        run: npm run db:migrate
        env:
          NODE_ENV: development
          DATABASE_URL: postgresql://postgres:[REDACTED]@localhost:5432/creative_platform
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://127.0.0.1:3010
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3010
      - name: Start development server
        run: npx next dev -p 3010 -H 127.0.0.1 > /tmp/creative-platform-next.log 2>&1 &
        env:
          NODE_ENV: development
          DATABASE_URL: postgresql://postgres:[REDACTED]@localhost:5432/creative_platform
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://127.0.0.1:3010
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3010
          LOCAL_AUTH_BYPASS: "true"
      - name: Wait for development server
        run: |
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3010/admin > /dev/null && exit 0
            sleep 2
          done
          cat /tmp/creative-platform-next.log
          exit 1
      - name: Run authenticated responsive admin smoke
        run: npm run test:responsive-admin
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3010
          NODE_ENV: development
          LOCAL_AUTH_BYPASS: "true"
          DATABASE_URL: postgresql://postgres:[REDACTED]@localhost:5432/creative_platform
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://127.0.0.1:3010
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3010
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-admin-next-log
          path: /tmp/creative-platform-next.log

  build:
    runs-on: ubuntu-latest
    needs: [ lint, test, typecheck, security-audit ]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Next.js build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Check Docker build
        run: docker build --target runtime -t creative-platform:ci-test .
        env:
          DOCKER_BUILDKIT: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: next-build
          path: .next/
          retention-days: 1

  secret-scan:
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run truffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: ${{ github.sha }}
          extra_args: --debug --only-verified

  database-migration-check:
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate migration files
        run: |
          echo "Checking for valid migration files..."
          if [ -d "drizzle" ]; then
            find drizzle -name "*.sql" -type f | head -10
            echo "Migration files found and validated"
          else
            echo "No migrations directory found"
          fi

      - name: Generate migration preview
        run: npm run db:migrate --dry-run || true
