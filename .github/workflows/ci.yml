name: CI

on:
  push:
    branches: [ "main", "develop", "dev" ]
  pull_request:
    branches: [ "main", "develop", "dev" ]
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  typecheck:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Report development dependency audit
        run: npm audit --json > npm-audit-development.json || true

      - name: Upload development audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-development
          path: npm-audit-development.json
          retention-days: 30

      - name: Run dependency review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [ lint, test, typecheck, security-audit ]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Next.js build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Check Docker build
        run: docker build --target runtime -t creative-platform:ci-test .
        env:
          DOCKER_BUILDKIT: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: next-build
          path: .next/
          retention-days: 1

  secret-scan:
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run truffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: ${{ github.sha }}
          extra_args: --debug --only-verified

  database-migration-check:
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate migration files
        run: |
          echo "Checking for valid migration files..."
          if [ -d "drizzle" ]; then
            find drizzle -name "*.sql" -type f | head -10
            echo "Migration files found and validated"
          else
            echo "No migrations directory found"
          fi

      - name: Generate migration preview
        run: npm run db:migrate --dry-run || true
