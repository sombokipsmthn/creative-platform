[databases]
# Database connection definitions
# Format: database = host=localhost port=5432 dbname=mydb
kipsmthn = host=postgres port=5432 dbname=kipsmthn

[pgbouncer]
# Connection pooling parameters
pool_mode = transaction
# Max connections per database
max_client_conn = 1000
# Default pool size (connections per db)
default_pool_size = 25
# Minimum pool size (keep warm connections)
min_pool_size = 10
# Maximum DB connections (safety limit)
max_db_connections = 100
# Timeout for idle connections (seconds)
idle_in_transaction_session_timeout = 60
# Connection timeout (seconds)
connect_timeout = 15
# Server connection lifetime (seconds)
server_lifetime = 3600
# Idle server timeout (seconds)
server_idle_timeout = 600
# Query timeout (seconds, 0 = disabled)
query_timeout = 0
# Maximum query queue size
query_wait_timeout = 120
# Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
# Reserve pool connections
reserve_pool_size = 5
reserve_pool_timeout = 3
# Statistics
stats_period = 60
# Listen address and port
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /var/run/pgbouncer
# Admin console
admin_users = admin
