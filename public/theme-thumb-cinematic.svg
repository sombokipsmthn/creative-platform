<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Cinematic theme: dark background, immersive full-bleed hero -->
  <rect width="400" height="300" fill="#080808"/>

  <!-- Dark gradient overlay at top for title -->
  <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#000000" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </linearGradient>
  <rect width="400" height="100" fill="url(#topFade)"/>

  <!-- Title area -->
  <rect x="20" y="20" width="140" height="16" fill="#FFFFFF" opacity="0.9"/>
  <rect x="320" y="20" width="60" height="12" fill="#FFFFFF" opacity="0.3"/>

  <!-- Full-bleed hero image -->
  <rect x="0" y="0" width="400" height="200" fill="#1A1A1A" rx="0"/>
  <ellipse cx="200" cy="100" rx="180" ry="80" fill="#2A2A2A" opacity="0.6"/>
  <ellipse cx="200" cy="100" rx="100" ry="45" fill="#3A3A3A" opacity="0.5"/>

  <!-- Bottom gradient overlay for controls -->
  <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
  </linearGradient>
  <rect y="180" width="400" height="120" fill="url(#bottomFade)"/>

  <!-- Progress dots at bottom -->
  <g fill="#FFFFFF" opacity="0.4">
    <circle cx="180" cy="270" r="3"/>
    <circle cx="200" cy="270" r="4" opacity="1"/>
    <circle cx="220" cy="270" r="3"/>
    <circle cx="240" cy="270" r="3"/>
    <circle cx="260" cy="270" r="3"/>
  </g>

  <!-- Side nav arrows hint -->
  <circle cx="30" cy="150" r="12" fill="#FFFFFF" opacity="0.1"/>
  <circle cx="370" cy="150" r="12" fill="#FFFFFF" opacity="0.1"/>
</svg>