<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Editorial theme: magazine-inspired, warm background, asymmetric layout -->
  <rect width="400" height="300" fill="#F7F5F1"/>

  <!-- Header with editorial feel -->
  <rect x="20" y="16" width="120" height="14" fill="#181818" opacity="0.15"/>
  <rect x="320" y="16" width="60" height="12" fill="#181818" opacity="0.08"/>

  <!-- Large featured image (left side, spans 2 rows) -->
  <rect x="20" y="44" width="236" height="176" fill="#D4C9BE" rx="0"/>

  <!-- Two smaller images on right column -->
  <rect x="268" y="44" width="112" height="84" fill="#C4B5A6" rx="0"/>
  <rect x="268" y="136" width="112" height="84" fill="#D4C9BE" rx="0"/>

  <!-- Caption/text area under featured -->
  <rect x="20" y="232" width="236" height="12" fill="#181818" opacity="0.12"/>
  <rect x="20" y="248" width="180" height="8" fill="#181818" opacity="0.08"/>

  <!-- Small supporting row at bottom -->
  <rect x="20" y="270" width="72" height="8" fill="#181818" opacity="0.06"/>
  <rect x="104" y="270" width="72" height="8" fill="#181818" opacity="0.06"/>
  <rect x="188" y="270" width="72" height="8" fill="#181818" opacity="0.06"/>

  <!-- Right column caption -->
  <rect x="268" y="232" width="112" height="8" fill="#181818" opacity="0.1"/>
  <rect x="268" y="244" width="80" height="6" fill="#181818" opacity="0.06"/>
</svg>