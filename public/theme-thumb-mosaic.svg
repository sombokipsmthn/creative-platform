<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Mosaic theme: white background, masonry-style varied grid -->
  <rect width="400" height="300" fill="#FFFFFF"/>

  <!-- Header -->
  <rect x="20" y="16" width="100" height="12" fill="#111827" opacity="0.15"/>
  <rect x="320" y="16" width="60" height="10" fill="#111827" opacity="0.08"/>

  <!-- Masonry grid - 4 columns, varied heights -->
  <!-- Column 1: tall, short, tall -->
  <rect x="20" y="44" width="88" height="112" fill="#C4C4C4" rx="6"/>
  <rect x="20" y="168" width="88" height="52" fill="#D4D4D4" rx="6"/>
  <rect x="20" y="232" width="88" height="60" fill="#C4C4C4" rx="6"/>

  <!-- Column 2: short, tall, short -->
  <rect x="116" y="44" width="88" height="52" fill="#D4D4D4" rx="6"/>
  <rect x="116" y="108" width="88" height="140" fill="#C4C4C4" rx="6"/>
  <rect x="116" y="260" width="88" height="28" fill="#D4D4D4" rx="6"/>

  <!-- Column 3: tall, short -->
  <rect x="212" y="44" width="88" height="140" fill="#C4C4C4" rx="6"/>
  <rect x="212" y="196" width="88" height="84" fill="#D4D4D4" rx="6"/>

  <!-- Column 4: short, tall, short -->
  <rect x="308" y="44" width="72" height="52" fill="#D4D4D4" rx="6"/>
  <rect x="308" y="108" width="72" height="112" fill="#C4C4C4" rx="6"/>
  <rect x="308" y="232" width="72" height="56" fill="#D4D4D4" rx="6"/>

  <!-- Footer stats -->
  <rect x="20" y="276" width="80" height="8" fill="#111827" opacity="0.1"/>
  <rect x="300" y="276" width="80" height="8" fill="#111827" opacity="0.08"/>
</svg>